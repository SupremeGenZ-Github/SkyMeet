services:
  - type: web
    name: skymeet
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: MAX_PARTICIPANTS
        value: "8"
